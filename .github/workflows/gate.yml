# Runs the gate on every pull request. The required status check is the job 'gate'.
#
# Every rule lives in Scripts/Invoke-Gate.ps1; this file only installs the pinned tools
# and calls it (decision 31). Another CI host needs only its own copy of these steps.
#
# [SEC] Least privilege: a read-only token, no secrets, no write-capable trigger
# (pull_request, never pull_request_target), the token is not kept in the checkout,
# and the one action used is pinned to a full commit SHA.

name: gate

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # The pull request head, not GitHub's merge commit: the commit checks then see
      # exactly the pull request's own commits. The full history gives origin/master
      # for -Base. Branch protection requires the head to be up to date with master.
      - name: Check out the pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install tools and run the gate
        shell: pwsh
        env:
          GATE_BASE: origin/${{ github.base_ref }}
        run: |
          & ./Scripts/Install-GateTool.ps1 -Destination (Join-Path -Path $env:RUNNER_TEMP -ChildPath 'gate-tools')
          & ./Scripts/Invoke-Gate.ps1 -Unit -Base $env:GATE_BASE
          exit $LASTEXITCODE
